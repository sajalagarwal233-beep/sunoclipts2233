<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="How to Kick SaaS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- open book -->
  <g>
    <path d="M40 92 c26-10 46-10 68 0 v86 c-22-10-42-10-68 0 z" fill="url(#page)" opacity="0.96"/>
    <path d="M216 92 c-26-10-46-10-68 0 v86 c22-10 42-10 68 0 z" fill="url(#page)" opacity="0.82"/>
    <path d="M108 92 c-8-3-16-5-24-6 v86 c8 1 16 3 24 6 z" fill="#bfdbfe" opacity="0.55"/>
    <path d="M148 92 c8-3 16-5 24-6 v86 c-8 1-16 3-24 6 z" fill="#bfdbfe" opacity="0.45"/>
    <rect x="126" y="90" width="4" height="90" rx="2" fill="#1e3a8a" opacity="0.35"/>
    <!-- text lines -->
    <g fill="#2563eb" opacity="0.5">
      <rect x="56" y="106" width="40" height="5" rx="2.5"/>
      <rect x="56" y="120" width="34" height="5" rx="2.5"/>
      <rect x="56" y="134" width="40" height="5" rx="2.5"/>
      <rect x="56" y="148" width="28" height="5" rx="2.5"/>
      <rect x="160" y="106" width="40" height="5" rx="2.5"/>
      <rect x="160" y="120" width="34" height="5" rx="2.5"/>
      <rect x="160" y="134" width="40" height="5" rx="2.5"/>
      <rect x="160" y="148" width="28" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- upward growth arrow -->
  <g>
    <path d="M64 214 L112 160 L150 186 L204 112" fill="none" stroke="#22d3ee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 108 L208 108 L208 146" fill="none" stroke="#22d3ee" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
